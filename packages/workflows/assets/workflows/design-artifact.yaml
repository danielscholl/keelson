# Reference authoring pipeline for designed canvas artifacts: read the design
# guide, author a self-contained themed page, publish it through the validated
# canvas_publish gate. Palette validation is fail-closed inside the tool, so a
# bad palette surfaces as a tool error the author node must fix and retry —
# fail_on_tool_error stays off for exactly that reason.
# No provider pin — the author runs the deep tier on whichever provider is
# active; operators can pin `provider:` here or via KEELSON_WORKFLOW_PROVIDER.

name: design-artifact
description: |
  Use when: User wants a designed, shareable HTML page — a report, briefing, chart, or
            dashboard — built from data or findings and published to the canvas.
  Triggers: "make a report of", "publish an artifact", "chart this as a page",
            "design a briefing", "canvas report".
  Does: Reads the canvas design guide (kit, voice, and page sections, plus chart and
        diagram sections as needed), authors a self-contained page on the keelson kit in
        the house voice, and publishes it via canvas_publish, which validates declared
        chart palettes (CVD + contrast) fail-closed.
  NOT for: Live operational status a rib already renders as a board (open that surface),
           plain prose answers (chat), or multi-page sites (one page per artifact).

nodes:
  - id: author
    model: deep
    model_by_provider:
      copilot: gpt-6-astra
    effort: xhigh
    prompt: |
      Build a designed canvas artifact for this request:

      $ARGUMENTS

      You have exactly two tools: `canvas_design_guide` and `canvas_publish`.
      You have NO filesystem and NO shell. There is no `create`, no
      `apply_patch`, no `bash`, and no editor.

      **The page is never a file.** `canvas_publish` takes the complete markup
      inline as its `html` parameter. Pass the whole document in the tool call
      itself; do not try to write it out first.

      If any tool call comes back refused, that tool is not yours in this run.
      Do not retry it and do not stop working. Go straight to `canvas_publish`
      with the markup.

      Work in this order:
      1. Call canvas_design_guide with section "kit" (the stylesheet to start
         from), "voice" (how the copy reads), and "page" (which page type fits
         this request). Add "form" and "color" if the page carries any chart,
         and "graphics" if it carries a diagram.
      2. Author ONE self-contained HTML page following the guide: the kit's
         stylesheet (keelson's tokens, dark on :root and light overrides on
         :root[data-theme="light"]), real content from the request above, copy
         in the house voice, no external resources. Declare any categorical
         chart palette on <body data-palette-dark="…" data-palette-light="…">.
      3. Check the draft once against canvas_design_guide "anti-patterns",
         fix what it catches, then publish with canvas_publish. If it rejects
         the palette, fix the colors (prefer the keelson series slots) and
         publish again.

      Finish with a short report of the published artifact's title. Your LAST
      line must be one of these two, exactly, with nothing after it:

      - `ARTIFACT_KEY=canvas:artifact:<slug>` — copy the key from the
       `canvas_publish` tool result; do not reconstruct it.
      - `ARTIFACT_UNAVAILABLE` — only when `canvas_publish` was not registered
       among your tools. Never use this because a call was refused or errored.
    allowed_tools: [canvas_publish, canvas_design_guide]
    require_tool_call: [canvas_publish]
    idle_timeout: 1800000
