name: resolve-pr
model: balanced
description: |
  Use when: User wants an existing same-repo PR driven to a mergeable state —
            review threads handled, fixes pushed, CI green.
  Triggers: "resolve PR #123", "finish pr", "get this PR green",
            "handle the review comments", "drive PR to merge".
  Does: Fetches unresolved review threads each round via GraphQL -> skips
        threads already answered (by this run, a prior run, or a human — any
        thread whose last comment is not the reviewer's) -> triages new threads
        (fix / reply with evidence, flagging rebuttals whose cited evidence
        this PR itself changes) -> pauses for approval ONLY when a round would
        publicly push back on a reviewer (wontfix / invalid / question) ->
        fixes actionable threads -> validates and pushes -> replies on every
        handled thread -> resolves fixed threads plus approved invalid /
        already-addressed rebuttals (question stays open; wontfix stays open
        unless explicitly enabled with `resolve_wontfix=true` and approved) ->
        waits for CI -> repeats until CI passes and a clean round observes no
        new threads, or escalates at the round cap.
  NOT for: Fork PRs, which cannot be pushed safely by this workflow.
           Creating a PR from an issue (use fix-issue).
           Reviewing a PR without changing it (use pr-review).

requiresProject: true
worktree:
  enabled: true

converge:
  gate: converge-check
  max_rounds: 8
  on_exhaust: approval

nodes:
  - id: extract-pr
    model: balanced
    prompt: |
      Find the PR or MR number for this request.

      Request: $ARGUMENTS

      Rules:
      - If the message contains an explicit PR number ("#42", "PR 42", "42"),
        extract it.
      - If the message is ambiguous, return the literal string CURRENT; the next
        node will resolve it from the current branch.

      Output ONLY the bare integer, or the literal CURRENT. No quotes, no
      markdown, no explanation.

  - id: fetch-state
    depends_on: [extract-pr]
    bash: |
      set -euo pipefail

      ROUND="$converge.round"
      RAW=$(printf '%s' "$KEELSON_NODE_extract_pr_OUTPUT" | tr -d "'\"\`\n " )
      if [ "$RAW" = "CURRENT" ] || [ -z "$RAW" ]; then
        # This run executes in an isolated worktree on a generated branch, so the
        # target PR cannot be inferred from the current branch — require it.
        echo "resolve-pr needs an explicit PR number: it runs in an isolated worktree on a generated branch and cannot infer the PR from the current branch. Invoke like 'resolve pr 42'." >&2
        exit 1
      fi
      # `|| true` so a no-digit input yields an empty PR_NUM and reaches the
      # explicit check below, rather than tripping `set -o pipefail` (grep exits 1).
      PR_NUM=$(printf '%s' "$RAW" | grep -oE '[0-9]+' | head -1 || true)

      if [ -z "$PR_NUM" ]; then
        echo "Could not parse a PR number from '$RAW'; pass one like 'converge pr 42'." >&2
        exit 1
      fi

      echo "$PR_NUM" > "$KEELSON_ARTIFACTS_DIR/.pr-number"
      echo "Round $ROUND: fetching PR #$PR_NUM state" >&2

      # Written once, sourced by fetch-state and post-ci-state so the two never
      # drift. `new` comes from the thread itself, never the ledger: no replies
      # yet, or the reviewer holds the last comment — so an answered thread is
      # skipped across runs and hand-replies, and a reviewer follow-up reopens
      # triage even mid-run, after this run already replied. The per-run ledger
      # (it dies with the artifacts dir) feeds only the resolve-retry lane.
      cat > "$KEELSON_ARTIFACTS_DIR/thread-lib.sh" <<'THREADLIB'
      fetch_thread_state() {
        local PR_NUM="$1" STATE_OUT="$2"
        local HANDLED="$KEELSON_ARTIFACTS_DIR/handled.json"
        local COMBINED="${STATE_OUT}.combined.json"
        [ -f "$HANDLED" ] || printf '[]\n' > "$HANDLED"
        # forge emits a gh-shaped reviewThreads.nodes[] array of the UNRESOLVED
        # threads, paginating internally — identically on GitHub (reviewThreads
        # GraphQL) and GitLab (MR discussions).
        forge pr threads "$PR_NUM" --unresolved > "$COMBINED"
        jq --slurpfile handled "$HANDLED" '
          # The ledger is append-only across rounds; only a thread'\''s LATEST
          # entry decides retry eligibility (an old failed-resolve entry must
          # not outvote a newer non-resolvable verdict). group_by is stable,
          # so .[-1] per group is the last-appended entry.
          (($handled[0] // []) | group_by(.threadId) | map(.[-1])) as $ledger
          | ([$ledger[]?
              | select(.replied == true and (.resolved != true)
                  and .resolve_authorized == true)
              | .threadId] | unique) as $retryIds
          | map(select(.isResolved == false))
          | map({
              threadId: .id,
              path: .path,
              line: (.line // null),
              commentId: (.comments.nodes[0].databaseId // null),
              body: ([.comments.nodes[].body] | join("\n\n---\n\n")),
              author: (.comments.nodes[0].author.login // "unknown"),
              # lastComment is the forge-reported TRUE final comment; the
              # comments window is capped (first:50 on GitHub), so its last
              # node is only a fallback for older shims.
              lastAuthor: ((.lastComment.nodes // [])[-1].author.login
                // .comments.nodes[-1].author.login // "unknown"),
              replyCount: (((.comments.nodes | length) - 1) | if . < 0 then 0 else . end)
            })
          | . as $open
          | ($open | map(select(.replyCount == 0 or .lastAuthor == .author))) as $new
          | ([$new[].threadId]) as $newIds
          # A reviewer follow-up reopens a thread OUT of the retry lane: its
          # stale ledger entry must not resolve it under the prior approval
          # before the follow-up is triaged.
          | {
              open: $open,
              new: $new,
              retry: ($open | map(select(
                  ((.threadId as $id | $retryIds | index($id)) != null)
                  and ((.threadId as $id | $newIds | index($id)) == null)
                )))
            }
        ' "$COMBINED" > "$STATE_OUT"
        rm -f "$COMBINED"
      }
      THREADLIB

      IS_FORK=$(forge pr view "$PR_NUM" --json isCrossRepository -q '.isCrossRepository')
      if [ "$IS_FORK" = "true" ]; then
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/threads.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/all-unresolved-threads.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/resolve-retry.json"
        jq -cn --arg is_fork "$IS_FORK" \
          '{is_fork: $is_fork, has_new: "false", new_count: 0, open_count: 0, retry_count: 0}'
        exit 0
      fi

      forge pr view "$PR_NUM" --json headRefName -q '.headRefName' \
        > "$KEELSON_ARTIFACTS_DIR/.pr-head-ref"
      if [ "$ROUND" = "1" ] || [ ! -f "$KEELSON_ARTIFACTS_DIR/.checked-out-pr" ]; then
        forge pr checkout "$PR_NUM" --detach >&2
        printf '%s\n' "$PR_NUM" > "$KEELSON_ARTIFACTS_DIR/.checked-out-pr"
      fi

      HANDLED="$KEELSON_ARTIFACTS_DIR/handled.json"
      if [ ! -f "$HANDLED" ]; then
        printf '[]\n' > "$HANDLED"
      fi
      if ! jq -e 'type == "array"' "$HANDLED" >/dev/null; then
        echo "handled.json must be a JSON array; refusing to risk duplicate replies." >&2
        exit 1
      fi

      . "$KEELSON_ARTIFACTS_DIR/thread-lib.sh"
      fetch_thread_state "$PR_NUM" "$KEELSON_ARTIFACTS_DIR/thread-state.json"

      jq '.open' "$KEELSON_ARTIFACTS_DIR/thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/all-unresolved-threads.json"
      jq '.new' "$KEELSON_ARTIFACTS_DIR/thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/threads.json"
      jq '.retry' "$KEELSON_ARTIFACTS_DIR/thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/resolve-retry.json"

      OPEN_COUNT=$(jq '.open | length' "$KEELSON_ARTIFACTS_DIR/thread-state.json")
      NEW_COUNT=$(jq '.new | length' "$KEELSON_ARTIFACTS_DIR/thread-state.json")
      RETRY_COUNT=$(jq '.retry | length' "$KEELSON_ARTIFACTS_DIR/thread-state.json")
      HAS_NEW=false
      if [ "$NEW_COUNT" -gt 0 ]; then
        HAS_NEW=true
      fi

      echo "Round $ROUND: $OPEN_COUNT unresolved threads, $NEW_COUNT new, $RETRY_COUNT resolve-retry for this run." >&2
      jq -cn \
        --arg is_fork "$IS_FORK" \
        --arg has_new "$HAS_NEW" \
        --argjson new_count "$NEW_COUNT" \
        --argjson open_count "$OPEN_COUNT" \
        --argjson retry_count "$RETRY_COUNT" \
        '{is_fork: $is_fork, has_new: $has_new, new_count: $new_count, open_count: $open_count, retry_count: $retry_count}'

  - id: refuse-fork
    depends_on: [fetch-state]
    when: "$fetch-state.output.is_fork == 'true'"
    cancel: |
      resolve-pr only supports same-repo PRs because it pushes commits back to
      the PR head branch. Fork PRs must be handled manually or by a workflow
      with explicit fork-remote credentials.

  - id: triage
    depends_on: [fetch-state]
    when: "$fetch-state.output.has_new == 'true'"
    context: fresh
    model: deep
    model_by_provider:
      copilot: claude-opus-4.8
    effort: xhigh
    output_format:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items:
            type: object
            required:
              [threadId, path, decision, reasoning, reply_hint, evidence_changed_by_pr]
            properties:
              threadId: { type: string }
              path: { type: string }
              line: { type: ["integer", "null"] }
              decision:
                type: string
                enum:
                  [
                    actionable-code-change,
                    actionable-metadata-change,
                    question,
                    wontfix,
                    already-addressed,
                    invalid,
                  ]
              reasoning: { type: string }
              reply_hint: { type: string }
              evidence_changed_by_pr: { type: boolean }
    prompt: |
      You are triaging only the new unresolved PR review threads for round
      $converge.round.

      Full thread data is in `$ARTIFACTS_DIR/threads.json`; do not triage any
      thread absent from that file.

      ## Decision enum

      | Decision | When to use |
      |----------|-------------|
      | actionable-code-change | Reviewer is asking for a real code change we should make. |
      | actionable-metadata-change | Reviewer is asking for a PR body, title, or label change that does not modify repository files. |
      | question | Reviewer is asking a question; a reply explaining the decision is enough. |
      | wontfix | We disagree or the change is out of scope; we'll explain why. |
      | already-addressed | The concern was already fixed in a later commit or is moot. |
      | invalid | The finding is factually wrong; we'll reply with evidence and change nothing. |

      ## Verify before you classify

      The worktree is on the PR's head commit. Read the actual code at each
      thread's `path:line` before deciding. Reviewers, especially bots, can post
      confident findings the code contradicts. If a claim is wrong, classify it
      `invalid`, put the evidence in `reasoning` / `reply_hint`, and never
      change code to satisfy it.

      ## Check whether the PR changed your evidence

      Before you cite any file as evidence against a reviewer, check whether
      this PR itself modifies it: read the PR's base
      (`forge pr view <n> --json baseRefName -q .baseRefName`, with `<n>` from
      `$ARTIFACTS_DIR/.pr-number`) and run
      `git diff origin/<base>...HEAD -- <file>`. Set `evidence_changed_by_pr`
      to true when the lines you rely on are added or edited by this PR, and
      false otherwise. When it is true, `reasoning` and `reply_hint` MUST say
      the PR changes that text — a rebuttal that quotes a rule this same PR
      rewrote, as if it were standing policy, misleads the reviewer even when
      it is accurate against HEAD.

      A reviewer who is right about the pre-PR state of a rule the PR
      deliberately changes is not wrong: that is `wontfix` (explain the
      change and why it is intended), never `invalid`. And when honoring the
      reviewer costs one small compliant edit, prefer an actionable decision
      over arguing. Use `actionable-metadata-change` only for PR body, title, or
      label edits; use `actionable-code-change` for repository content.

      ## Output

      For each thread, fill `threadId`, `path`, `line` (null if absent),
      `decision`, `reasoning` (one sentence), `reply_hint` (the gist of the
      reply), and `evidence_changed_by_pr`.

      Write the triage JSON to `$ARTIFACTS_DIR/triage.json` and print it.

  - id: triage-gate
    depends_on: [triage]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -euo pipefail
      FETCHED=$(jq -cS '[.[].threadId] | sort' "$KEELSON_ARTIFACTS_DIR/threads.json")
      TRIAGED=$(jq -cS '[.threads[].threadId] | sort' "$KEELSON_ARTIFACTS_DIR/triage.json")
      if [ "$FETCHED" != "$TRIAGED" ]; then
        echo "triage.json thread ids do not match threads.json; refusing to continue with incomplete triage." >&2
        echo "fetched: $FETCHED" >&2
        echo "triaged: $TRIAGED" >&2
        exit 1
      fi

      RESOLVE_WONTFIX=false
      if [ "${KEELSON_INPUTS_resolve_wontfix:-}" = "true" ]; then
        RESOLVE_WONTFIX=true
      fi
      jq -cn --argjson resolve_wontfix "$RESOLVE_WONTFIX" \
        '{resolve_wontfix: $resolve_wontfix}' \
        > "$KEELSON_ARTIFACTS_DIR/resolve-mode.json"

      # Human-readable round summary for the approval canvas; triage.json stays
      # the machine artifact downstream nodes consume. Presentation only, so a
      # generation failure warns instead of failing the gate — the honesty
      # check above is the only fail-closed part of this node.
      if ! jq -r --slurpfile th "$KEELSON_ARTIFACTS_DIR/threads.json" --arg round "$converge.round" '
        ($th[0] | map({(.threadId): .}) | add) as $by_id
        | (.threads | length) as $total
        | ([.threads[] | select(
            .decision == "actionable-code-change"
            or .decision == "actionable-metadata-change"
          )] | length) as $fix
        | def loc(t): t.path + (if t.line then ":\(t.line)" else "" end);
        [ "# Triage — round \($round)",
          "",
          "**\($total) new thread\(if $total == 1 then "" else "s" end).** "
            + "Fix and push: \($fix) · Reply only, left open: \($total - $fix).",
          "",
          "| # | Decision | Location | Reviewer |",
          "|---|----------|----------|----------|" ]
        + [ .threads | to_entries[] | .value as $t
            | "| \(.key + 1) | \($t.decision) | `\(loc($t) | gsub("\\|"; "\\|"))` | \($by_id[$t.threadId].author // "unknown") |" ]
        + [ .threads | to_entries[] | .value as $t
            | "\n## \(.key + 1) — \($t.decision)\n\n"
              + "`\(loc($t))`\n\n"
              + (if $t.evidence_changed_by_pr == true
                 then "**⚠ The cited evidence is modified by this PR itself — verify the rebuttal is disclosed as such.**\n\n"
                 else "" end)
              + "**Reasoning:** \($t.reasoning | gsub("\n"; " "))\n\n"
              + "**Planned reply:** \($t.reply_hint | gsub("\n"; " "))" ]
        | join("\n")
      ' "$KEELSON_ARTIFACTS_DIR/triage.json" > "$KEELSON_ARTIFACTS_DIR/triage.md"; then
        echo "triage.md generation failed; the approval canvas will fall back to triage.json." >&2
      fi

      jq -c --slurpfile fetched "$KEELSON_ARTIFACTS_DIR/threads.json" \
        --argjson resolve_wontfix "$RESOLVE_WONTFIX" '
        ([.threads[] | select(
          .decision != "actionable-code-change"
          and .decision != "actionable-metadata-change"
        )] | length) as $n
        | {
            contentious: $n,
            needs_review: (if $n > 0 then "true" else "false" end),
            has_new: (if ($fetched[0] | length) > 0 then "true" else "false" end),
            resolve_wontfix: $resolve_wontfix
          }
      ' "$KEELSON_ARTIFACTS_DIR/triage.json"

  # Pauses only when the round would publicly push back on a reviewer without
  # changing code (question / wontfix / already-addressed / invalid verdicts).
  # An all-actionable round — every thread gets the fix it asked for — proceeds
  # unattended; `fix` tolerates the skip via none_failed_min_one_success and
  # sees an empty approval-feedback section.
  - id: approve
    depends_on: [triage-gate]
    when: "$triage-gate.output.needs_review == 'true'"
    approval:
      # Approval bodies are delivered raw (no substitution): the literal
      # `$ARTIFACTS_DIR/<path>` line is the machine hint the SPA turns into the
      # auto-opened review canvas, so no dynamic markers belong here.
      message: |
        Some of this round's threads are triaged as reply-only (question /
        wontfix / already-addressed / invalid) — the workflow is about to
        publicly disagree with or decline a reviewer without changing code.
        Review the verdicts in the triage summary, then approve to proceed, or
        type adjustments (e.g. "thread 2 is right — fix it instead of
        replying").

        Actionable threads are fixed, committed, pushed, and resolved. On your
        approval, invalid and already-addressed threads are replied to and then
        resolved — they assert nothing needs to change, and this approval is
        the human sign-off on that. Question and wontfix threads get a factual
        reply and stay open for the reviewer by default.

        If this run was explicitly started with
        `--inputs resolve_wontfix=true`, your approval also authorizes owner-side
        closure of wontfix, invalid, and already-addressed threads after a
        closing reply; questions always stay open.

        $ARTIFACTS_DIR/triage.md
      capture_response: true

  - id: fix
    depends_on: [triage-gate, approve]
    trigger_rule: none_failed_min_one_success
    when: "$triage-gate.output.has_new == 'true'"
    context: fresh
    model: deep
    model_by_provider:
      copilot: gpt-5.6-sol
    effort: xhigh
    idle_timeout: 1800000
    prompt: |
      You are fixing the round $converge.round actionable PR review threads.

      ## Approval feedback

      (Empty when this round needed no approval — an all-actionable batch runs
      unattended. "approve" means proceed as triaged.)

      $approve.output

      ## Triage

      $triage.output

      Full triage data: `$ARTIFACTS_DIR/triage.json`
      Thread data:      `$ARTIFACTS_DIR/threads.json`
      Resolution mode:  `$ARTIFACTS_DIR/resolve-mode.json`

      ## Setup - verify.sh

      First, discover this project's checks and write them to
      `$ARTIFACTS_DIR/verify.sh` with `set -euo pipefail` at the top so the
      first failing check aborts. Read whichever of `CLAUDE.md`, `AGENTS.md`,
      `CONTRIBUTING.md`, `README.md`, plus build config files exist.

      ## Rules

      - The worktree is at the PR head as a detached HEAD. Commit directly onto
        it; do not create, switch to, or reset a branch.
      - Apply operator adjustments from the approval feedback before writing
        code or composing replies.
      - Process only threads in `$ARTIFACTS_DIR/threads.json`.
      - Apply code changes only for triage entries with
        `decision == "actionable-code-change"`.
      - For `actionable-metadata-change`, read the PR number from
        `$ARTIFACTS_DIR/.pr-number` and make the requested edit with
        `forge pr edit` using only `--title`, `--body-file`, `--add-label`, or
        `--remove-label`. Before changing the body, read its current value with
        `forge pr view <n> --json body -q .body`, apply the narrowest change to
        the existing text, write the complete result under `$ARTIFACTS_DIR`,
        and pass that file with `--body-file`. Never compose a replacement body
        from scratch. Do not modify repository files or create a commit for a
        metadata-only fix.
      - For each actionable thread, read the target file before editing and run
        the narrowest check covering the change after editing.
      - Stage edited files by name. Never `git add -A`, `git add .`, or
        `git add -u`. Never commit anything under `$ARTIFACTS_DIR`.
      - Commit per thread or per logical group with a conventional message.
      - For `question`, `wontfix`, `already-addressed`, and `invalid`, make no
        code change; compose a factual reply only.
      - Read `resolve-mode.json` before composing replies. When
        `resolve_wontfix` is true, every `wontfix`, `invalid`, and
        `already-addressed` reply is an owner-side closing reply: restate the
        approved rationale and include this exact sentence:
        "reviewed and accepted on the maintainer side." Questions remain
        non-closing.
      - When a triage entry has `evidence_changed_by_pr: true`, the reply MUST
        state that this PR itself modifies the cited text (name the file), not
        present it as standing policy the reviewer overlooked.

      ## Results file

      After processing all new threads, write `$ARTIFACTS_DIR/results.json` as a
      JSON array, one entry per thread:

      ```json
      [
        {
          "threadId": "<graphql thread id>",
          "commentId": <database id for replies>,
          "action": "fixed",
          "decision": "actionable-code-change",
          "fix_kind": "code",
          "resolve_authorized": true,
          "commit": "<sha>",
          "reply": "<the reply text to post>"
        },
        {
          "threadId": "...",
          "commentId": 123,
          "action": "fixed",
          "decision": "actionable-metadata-change",
          "fix_kind": "metadata",
          "resolve_authorized": true,
          "commit": null,
          "reply": "<the reply text to post>"
        },
        {
          "threadId": "...",
          "commentId": 123,
          "action": "replied-only",
          "decision": "invalid",
          "fix_kind": null,
          "resolve_authorized": true,
          "commit": null,
          "reply": "..."
        }
      ]
      ```

      `action` is `"fixed"` only when the requested change was completed.
      `fix_kind` is `"code"` for a repository change with a non-empty commit,
      `"metadata"` for a completed PR metadata edit with `commit: null`, and
      `null` for reply-only decisions. Everything not fixed is `"replied-only"`.
      `resolve_authorized` is true for fixed results and for approved `invalid`
      / `already-addressed` results. It is true for `wontfix` only when
      `resolve-mode.json` enables the opt-in; it is always false for `question`.

      Print a summary when done.

  - id: validate
    depends_on: [fix]
    timeout: 1200000
    bash: |
      set +e
      VERIFY="$KEELSON_ARTIFACTS_DIR/verify.sh"
      if [ ! -f "$VERIFY" ]; then
        echo "No verify.sh recorded by the fix step; cannot verify the change."
        echo "VALIDATION_STATUS: FAIL"
        exit 0
      fi

      echo "=== PROJECT CHECKS ==="
      bash -e -o pipefail "$VERIFY" 2>&1
      STATUS=$?

      echo ""
      if [ $STATUS -eq 0 ]; then
        echo "VALIDATION_STATUS: PASS"
      else
        echo "VALIDATION_STATUS: FAIL"
      fi
      exit 0

  - id: fix-validation
    depends_on: [validate]
    context: fresh
    model: deep
    model_by_provider:
      copilot: gpt-5.6-sol
    effort: xhigh
    idle_timeout: 1800000
    prompt: |
      Review the validation output below.

      ## Validation

      $validate.output

      ## Instructions

      - If the output ends with `VALIDATION_STATUS: PASS`, respond with
        "All checks passed - no fixes needed." and stop.
      - If no `verify.sh` was recorded, discover this project's checks now,
        write `$ARTIFACTS_DIR/verify.sh`, and run it.
      - Otherwise, fix only what is broken. Do not add scope.
      - Stage edited files by name. Never `git add -A`, `git add .`, or
        `git add -u`. Never commit anything under `$ARTIFACTS_DIR`.
      - After each fix, re-run `bash $ARTIFACTS_DIR/verify.sh` to confirm.
      - Commit the fixes before handing off:
        `git add <files>; git commit -m "fix: address validation failures"`.

  - id: revalidate
    depends_on: [fix-validation]
    timeout: 1200000
    bash: |
      set -euo pipefail
      VERIFY="$KEELSON_ARTIFACTS_DIR/verify.sh"
      if [ ! -f "$VERIFY" ]; then
        echo "VALIDATION_STATUS: FAIL - no verify.sh recorded; refusing to push unverified changes"
        exit 1
      fi

      echo "=== PROJECT CHECKS ==="
      bash -e -o pipefail "$VERIFY" 2>&1
      echo "VALIDATION_STATUS: PASS"

  - id: push
    depends_on: [revalidate]
    when: "$triage-gate.output.has_new == 'true'"
    bash: |
      set -euo pipefail
      HEAD_REF=$(cat "$KEELSON_ARTIFACTS_DIR/.pr-head-ref" 2>/dev/null || true)
      if [ -z "$HEAD_REF" ]; then
        echo "No PR head ref recorded by fetch-state; cannot push." >&2
        exit 1
      fi
      git push origin "HEAD:refs/heads/$HEAD_REF"
      echo "Pushed to origin/$HEAD_REF."

  # Deterministic honesty gate: validate the model's results.json against the
  # triage BEFORE any public reply/resolve, so a malformed result can't skip a
  # reply or resolve a thread that wasn't fixed. Fail-closed.
  - id: reply-gate
    depends_on: [push]
    when: "$triage-gate.output.has_new == 'true'"
    bash: |
      set -euo pipefail
      R="$KEELSON_ARTIFACTS_DIR/results.json"
      T="$KEELSON_ARTIFACTS_DIR/triage.json"
      TH="$KEELSON_ARTIFACTS_DIR/threads.json"
      M="$KEELSON_ARTIFACTS_DIR/resolve-mode.json"
      FAILURES="$KEELSON_ARTIFACTS_DIR/reply-failures.json"
      ROUND="$converge.round"
      FAILURE_RECORDED=false
      record_failure() {
        local reason="$1"
        local threads="$2"
        [ -f "$FAILURES" ] || printf '[]\n' > "$FAILURES"
        if ! jq -e 'type == "array"' "$FAILURES" >/dev/null; then
          echo "reply-failures.json is not an array; could not record reply-gate failure." >&2
          return 1
        fi
        if ! jq --argjson round "$ROUND" --arg reason "$reason" --argjson threads "$threads" \
          '. + [{round: $round, stage: "reply-gate", threads: $threads, reason: $reason}]' \
          "$FAILURES" > "$FAILURES.tmp" || ! mv "$FAILURES.tmp" "$FAILURES"; then
          return 1
        fi
        FAILURE_RECORDED=true
      }
      record_unexpected_exit() {
        local status=$?
        local threads='[]'
        trap - EXIT
        if [ "$status" -ne 0 ] && [ "$FAILURE_RECORDED" != "true" ]; then
          if [ -f "$TH" ]; then
            threads=$(jq -cS '[.[].threadId] | sort' "$TH" 2>/dev/null || printf '[]')
          fi
          if ! record_failure "reply-gate exited before validation completed" "$threads"; then
            echo "Could not persist the unexpected reply-gate failure." >&2
          fi
        fi
        exit "$status"
      }
      trap record_unexpected_exit EXIT
      NEW_IDS=$(jq -cS '[.[].threadId] | sort' "$TH")
      if [ ! -f "$R" ]; then
        echo "results.json missing; refusing to reply/resolve." >&2
        if ! record_failure "results.json missing" "$NEW_IDS"; then
          echo "Could not persist the reply-gate failure." >&2
        fi
        exit 1
      fi
      if ! jq -e 'type == "array"' "$R" >/dev/null; then
        echo "results.json must be a JSON array." >&2
        if ! record_failure "results.json is not an array" "$NEW_IDS"; then
          echo "Could not persist the reply-gate failure." >&2
        fi
        exit 1
      fi
      if ! jq -e '.resolve_wontfix == true or .resolve_wontfix == false' "$M" >/dev/null; then
        echo "resolve-mode.json missing or invalid; refusing to reply/resolve." >&2
        if ! record_failure "resolve-mode.json missing or invalid" "$NEW_IDS"; then
          echo "Could not persist the reply-gate failure." >&2
        fi
        exit 1
      fi
      # Reply-all: every new thread has exactly one result entry (NOT deduplicated,
      # so a duplicate result id is caught rather than masked).
      RES_IDS=$(jq -cS '[.[].threadId] | sort' "$R")
      if [ "$NEW_IDS" != "$RES_IDS" ]; then
        echo "results.json thread ids do not match the new threads (missing, extra, or duplicate reply); refusing to mutate." >&2
        echo "new:    $NEW_IDS" >&2
        echo "result: $RES_IDS" >&2
        AFFECTED_IDS=$(jq -cn --argjson new "$NEW_IDS" --argjson result "$RES_IDS" \
          '$new + $result | unique')
        if ! record_failure "results.json thread ids do not match new threads" "$AFFECTED_IDS"; then
          echo "Could not persist the reply-gate failure." >&2
        fi
        exit 1
      fi
      # A fixed code result needs a commit; a fixed metadata result proves the
      # non-code path explicitly. Both must match the approved triage decision.
      BAD=$(jq -c --slurpfile tri "$T" --slurpfile th "$TH" --slurpfile mode "$M" '
        ($tri[0].threads | map({ (.threadId): .decision }) | add) as $dec
        | ($th[0] | map({ (.threadId): .commentId }) | add) as $cid
        | ($mode[0].resolve_wontfix == true) as $resolve_wontfix
        | [ .[]
            | select(
                (.action != "fixed" and .action != "replied-only")
                or (.action == "fixed" and ((
                  (
                    ($dec[.threadId]) == "actionable-code-change"
                    and .fix_kind == "code"
                    and (((.commit // "") | tostring | length) > 0)
                  )
                  or
                  (
                    ($dec[.threadId]) == "actionable-metadata-change"
                    and .fix_kind == "metadata"
                    and (((.commit // "") | tostring | length) == 0)
                  )
                ) | not))
                or (.decision != ($dec[.threadId]))
                or (.resolve_authorized != (
                  .action == "fixed"
                  or ($dec[.threadId]) == "invalid"
                  or ($dec[.threadId]) == "already-addressed"
                  or ($resolve_wontfix and ($dec[.threadId]) == "wontfix")
                ))
                or (
                  $resolve_wontfix
                  and (
                    ($dec[.threadId]) == "wontfix"
                    or ($dec[.threadId]) == "invalid"
                    or ($dec[.threadId]) == "already-addressed"
                  )
                  and (((.reply // "") | contains("reviewed and accepted on the maintainer side.")) | not)
                )
                or (((.reply // "") | tostring | length) == 0)
                or (.commentId != ($cid[.threadId]))
              )
            | .threadId ]
      ' "$R")
      if [ "$BAD" != "[]" ]; then
        echo "honesty gate failed for thread(s): $(printf '%s' "$BAD" | jq -r 'join(", ")')" >&2
        echo "(each result: action/fix evidence, decision, resolve authorization, closing-reply wording, non-empty reply, and commentId must match the approved triage and runtime mode)." >&2
        if ! record_failure "results.json failed the reply honesty gate" "$BAD"; then
          echo "Could not persist the reply-gate failure." >&2
        fi
        exit 1
      fi
      echo "honesty gate OK: $(jq 'length' "$R") result(s) validated against triage before reply/resolve."
      trap - EXIT

  - id: reply-resolve
    depends_on: [reply-gate]
    context: fresh
    model: balanced
    prompt: |
      Post replies, resolve the threads this run settled, and update the
      handled ledger for round $converge.round.

      ## Invariant

      - Post a reply on every entry in `$ARTIFACTS_DIR/results.json`.
      - A thread is RESOLVABLE exactly when its gate-validated
        `resolve_authorized == true`. Fixed code and metadata results are
        authorized. Approved `invalid` / `already-addressed` results are
        authorized. A `wontfix` is authorized only when `resolve-mode.json`
        enables the explicit opt-in and the operator approved the triage.
      - Resolve (via `forge pr resolve-thread`) every resolvable entry, AFTER
        its reply posts — the reply is the evidence trail for the resolution.
      - Never resolve a `question`. A default-mode `wontfix` also stays open.
        For an authorized owner-side `wontfix`, `invalid`, or
        `already-addressed` result, verify the closing reply restates the
        rationale and includes "reviewed and accepted on the maintainer side."
        before posting and resolving it.
      - Record a thread into `$ARTIFACTS_DIR/handled.json` as soon as its reply is
        posted, carrying `replied: true` and `resolved: <bool>` — `resolved: true`
        ONLY when a resolvable thread's resolve call SUCCEEDED,
        otherwise `resolved: false`. The posted reply itself is what stops the
        next round from re-triaging (our comment becomes the thread's last);
        the ledger exists for the resolve-retry lane: a resolvable thread whose
        resolve failed is recorded with `resolved: false` so a later round
        retries the resolve ONLY, without posting another reply.
      - If any `forge pr reply` or `forge pr resolve-thread` call fails, append
        a record immediately to `$ARTIFACTS_DIR/reply-failures.json` with
        `{round, stage:"reply-resolve", threads:[threadId], reason}`. Initialize
        a missing ledger as `[]`, require an existing ledger to be an array, and
        update it through a temporary file plus rename. A reply failure leaves
        the thread out of `handled.json`; a resolve failure records the posted
        reply with `resolved: false`.

      ## Steps

      1. Read `$ARTIFACTS_DIR/results.json`, `$ARTIFACTS_DIR/triage.json`,
         `$ARTIFACTS_DIR/threads.json`, `$ARTIFACTS_DIR/resolve-mode.json`, and
         `$ARTIFACTS_DIR/.pr-number`.
      2. For each result entry, post a reply on its thread:
         `forge pr reply {prNumber} --thread {threadId} --comment {commentId} --body "{reply text}"`
         (`forge` routes to the right forge; `--comment` carries the first
         comment's databaseId that the GitHub path needs.)
      3. For each entry with `resolve_authorized == true`, resolve the thread:
         `forge pr resolve-thread {prNumber} --thread {threadId}`.
      4. Write `$ARTIFACTS_DIR/outcome.json`:
         `{ "replied": [...], "resolved": [...], "left_open": [...] }`
      5. Append to `$ARTIFACTS_DIR/handled.json` one entry per thread whose reply
         posted, preserving existing entries and recording `threadId`,
         `commentId`, `action`, `decision`, `fix_kind`, `commit`, `reply`,
         `resolve_authorized`, `replied: true`, `resolved` (true ONLY when an
         authorized thread's resolve succeeded, else false), and
         `round: $converge.round`. Record every replied thread — INCLUDING an
         authorized thread whose resolve failed (with `resolved: false`), so it
         is retried resolve-only and never re-replied.
      6. Print a summary: how many replied, resolved, left open, failed, and
         newly recorded in handled.json.

  - id: reply-audit
    depends_on: [reply-gate, reply-resolve]
    trigger_rule: all_done
    bash: |
      set -euo pipefail
      ROUND="$converge.round"
      FAILURES="$KEELSON_ARTIFACTS_DIR/reply-failures.json"
      AUDIT="$KEELSON_ARTIFACTS_DIR/reply-audit.json"
      [ -f "$FAILURES" ] || printf '[]\n' > "$FAILURES"
      if jq -e 'type == "array"' "$FAILURES" >/dev/null; then
        jq --argjson round "$ROUND" '[.[] | select(.round == $round)]' \
          "$FAILURES" > "$AUDIT"
      else
        jq -cn --argjson round "$ROUND" \
          '[{round: $round, stage: "reply-audit", threads: [], reason: "reply-failures.json is not an array"}]' \
          > "$AUDIT"
      fi
      FAILURE_COUNT=$(jq 'length' "$AUDIT")
      REPLY_FAILED=false
      if [ "$FAILURE_COUNT" -gt 0 ]; then
        REPLY_FAILED=true
      fi
      jq -cn --arg reply_failed "$REPLY_FAILED" --argjson failure_count "$FAILURE_COUNT" \
        '{reply_failed: $reply_failed, failure_count: $failure_count}'

  - id: reply-failure-approval
    depends_on: [reply-audit]
    when: "$reply-audit.output.reply_failed == 'true'"
    approval:
      message: |
        A public review-thread reply or resolution failed in this round. The
        workflow will not continue to CI until you review the failure record
        and approve the retry path.

        $ARTIFACTS_DIR/reply-audit.json

  # Resolve-only retry path for ledger-authorized threads replied to in a prior
  # round whose resolveReviewThread call failed. fetch-state records these into
  # resolve-retry.json; this node re-calls resolveReviewThread WITHOUT posting
  # another reply (no duplicate comments), and flips the ledger entry to
  # resolved on success so a resolved thread stops being retried.
  - id: resolve-retry
    depends_on: [fetch-state]
    bash: |
      set -euo pipefail
      RETRY="$KEELSON_ARTIFACTS_DIR/resolve-retry.json"
      HANDLED="$KEELSON_ARTIFACTS_DIR/handled.json"
      PR_NUM=$(cat "$KEELSON_ARTIFACTS_DIR/.pr-number")
      if [ ! -f "$RETRY" ] || [ "$(jq 'length' "$RETRY" 2>/dev/null || echo 0)" -eq 0 ]; then
        echo "No resolvable-but-unresolved threads to retry this round."
        exit 0
      fi
      COUNT=$(jq 'length' "$RETRY")
      echo "Retrying resolveReviewThread for $COUNT resolvable-but-unresolved thread(s)."
      OK="$KEELSON_ARTIFACTS_DIR/.resolve-retry-ok.json"
      printf '[]\n' > "$OK"
      jq -r '.[].threadId' "$RETRY" | tr -d '\r' | while read -r TID; do
        [ -n "$TID" ] || continue
        if forge pr resolve-thread "$PR_NUM" --thread "$TID" >&2; then
          jq --arg id "$TID" '. + [$id]' "$OK" > "$OK.tmp" && mv "$OK.tmp" "$OK"
          echo "Resolved $TID on retry." >&2
        else
          echo "Resolve still failing for $TID; will retry next round." >&2
        fi
      done
      if [ -f "$HANDLED" ]; then
        jq --slurpfile ok "$OK" '
          ($ok[0] // []) as $done
          | map(if (.threadId as $id | $done | index($id)) != null then (.resolved = true) else . end)
        ' "$HANDLED" > "$HANDLED.tmp" && mv "$HANDLED.tmp" "$HANDLED"
      fi
      echo "resolve-retry: $(jq 'length' "$OK") of $COUNT resolved on retry."

  - id: await-ci
    # refuse-fork is a dependency so it sits in the gate's converge subgraph and
    # cancels a fork run BEFORE await-ci reruns any CI jobs; a non-fork skips it,
    # tolerated by none_failed_min_one_success. The reply audit and its approval
    # prevent a failed public mutation from silently rolling into CI.
    depends_on:
      [
        reply-resolve,
        reply-audit,
        reply-failure-approval,
        fetch-state,
        refuse-fork,
        resolve-retry,
      ]
    trigger_rule: none_failed_min_one_success
    timeout: 1500000
    bash: |
      set -uo pipefail
      PR_NUM=$(cat "$KEELSON_ARTIFACTS_DIR/.pr-number" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$PR_NUM" ]; then
        echo "CI_STATUS: UNKNOWN - no .pr-number recorded; cannot watch CI"
        exit 0
      fi
      # GitHub briefly reports zero checks while replacing runs after a push.
      CHECK_COUNT=0
      FORGE_OK=1
      ATTEMPT=1
      CHECK_MAX_ATTEMPTS=6
      # Internal test-only override; production waits 10 seconds between attempts.
      CI_RECHECK_INTERVAL="${KEELSON_CI_RECHECK_INTERVAL:-10}"
      while :; do
        if CHECK_COUNT=$(forge pr checks "$PR_NUM" --json state -q 'length' 2>/dev/null); then
          FORGE_OK=1
          [ "${CHECK_COUNT:-0}" -gt 0 ] 2>/dev/null && break
        else
          FORGE_OK=0
          CHECK_COUNT=0
        fi
        [ "$ATTEMPT" -ge "$CHECK_MAX_ATTEMPTS" ] && break
        ATTEMPT=$((ATTEMPT + 1))
        sleep "$CI_RECHECK_INTERVAL"
      done
      if [ "$FORGE_OK" -ne 1 ]; then
        echo "CI_STATUS: UNKNOWN - could not query CI checks for PR #$PR_NUM (forge call failed)"
        exit 0
      fi
      if [ "${CHECK_COUNT:-0}" -eq 0 ] 2>/dev/null; then
        echo "CI_STATUS: UNKNOWN - no CI checks present for PR #$PR_NUM after re-poll; nothing to gate on"
        exit 0
      fi
      snapshot_checks() {
        if forge pr checks "$PR_NUM" --json name,bucket,state \
          > "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.tmp" \
          2> "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.err" \
          && jq -e 'type == "array" and length > 0' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.tmp" >/dev/null 2>&1; then
          mv "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.tmp" "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json"
          return 0
        fi
        rm -f "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.tmp"
        return 1
      }
      log_advisory_checks() {
        if ! snapshot_checks; then
          echo "Could not refresh non-required check states for the audit log."
          cat "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.err" 2>/dev/null || true
          return
        fi
        printf '%s\n' "$REQUIRED" > "$KEELSON_ARTIFACTS_DIR/.ci-required.txt"
        jq -r --rawfile required "$KEELSON_ARTIFACTS_DIR/.ci-required.txt" '
          def state: ((.state // .bucket // "unknown") | ascii_downcase);
          ($required | split("\n") | map(select(length > 0))) as $requiredNames
          | .[]
          | .name as $name
          | select(($requiredNames | index($name)) == null)
          | "treated as advisory: \($name) — \(state)"
        ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json"
      }

      # Discovery failure is NOT terminal: emitting UNKNOWN here would fail the
      # converge gate every round on a PR that is actually green. Fall back to
      # gating on EVERY check, strictly — with the required set unknown, nothing
      # may ride the advisory carve-outs (pending-past-deadline / cancelled).
      DISCOVERY_STRICT=0
      if ! REQUIRED=$(forge pr required-checks "$PR_NUM" 2> "$KEELSON_ARTIFACTS_DIR/.ci-required.err"); then
        cat "$KEELSON_ARTIFACTS_DIR/.ci-required.err" 2>/dev/null || true
        echo "Required-check discovery failed; gating on every check with no advisory carve-outs."
        REQUIRED=""
        DISCOVERY_STRICT=1
      fi
      if [ -z "$REQUIRED" ]; then
        [ "$DISCOVERY_STRICT" = 1 ] \
          || echo "No required checks configured; waiting for all checks to settle within the deadline."
        ATTEMPT=1
        MAX_ATTEMPTS=60
        while :; do
          if snapshot_checks; then
            if ! jq -e 'any(.[]?; (.bucket // "" | ascii_downcase) == "pending")' \
              "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json" >/dev/null 2>&1; then
              break
            fi
          fi
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            break
          fi
          ATTEMPT=$((ATTEMPT + 1))
          sleep 20
        done
        if [ ! -f "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json" ]; then
          echo "CI_STATUS: UNKNOWN - could not read CI check states before the deadline"
          exit 0
        fi
        if jq -e '
          def state: ((.state // .bucket // "") | ascii_downcase);
          any(.[]?; state == "fail" or state == "failed" or state == "failure")
        ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json" >/dev/null; then
          jq -r '
            def state: ((.state // .bucket // "") | ascii_downcase);
            .[] | select(state == "fail" or state == "failed" or state == "failure")
            | "failing check: \(.name) — \(state)"
          ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json"
          echo "CI_STATUS: FAIL"
          exit 0
        fi
        if [ "$DISCOVERY_STRICT" = 1 ]; then
          if jq -e '
            def state: ((.state // .bucket // "") | ascii_downcase);
            any(.[]?; ((.bucket // "" | ascii_downcase) == "pending")
              or state == "cancelled" or state == "canceled" or state == "timed_out")
          ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json" >/dev/null; then
            jq -r '
              def state: ((.state // .bucket // "unknown") | ascii_downcase);
              .[]
              | select(((.bucket // "" | ascii_downcase) == "pending")
                  or state == "cancelled" or state == "canceled" or state == "timed_out")
              | "not green and possibly required: \(.name) — \(state)"
            ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json"
            echo "CI_STATUS: FAIL"
            exit 0
          fi
        else
          jq -r '
            def state: ((.state // .bucket // "unknown") | ascii_downcase);
            .[]
            | if ((.bucket // "" | ascii_downcase) == "pending")
              then "treated as advisory: \(.name) — pending past deadline"
              elif state == "cancelled" or state == "canceled" or state == "timed_out"
              then "treated as advisory: \(.name) — \(state)"
              else empty
              end
          ' "$KEELSON_ARTIFACTS_DIR/.ci-snapshot.json"
        fi
        echo "CI_STATUS: PASS"
        exit 0
      fi

      echo "Waiting on required checks:"
      printf '%s\n' "$REQUIRED"
      if forge pr checks "$PR_NUM" --required --watch --interval 20 > "$KEELSON_ARTIFACTS_DIR/.ci-1.txt" 2>&1; then
        cat "$KEELSON_ARTIFACTS_DIR/.ci-1.txt"
        log_advisory_checks
        echo "CI_STATUS: PASS"
        exit 0
      fi
      echo "=== CI failed on first pass ==="
      cat "$KEELSON_ARTIFACTS_DIR/.ci-1.txt"
      # The whole converge subgraph reruns each round, so rerunning on every round
      # would rerun the same jobs up to max_rounds times for one unchanged commit.
      # Gate the rerun on a per-HEAD-SHA marker (artifacts persist across rounds):
      # at most one rerun per SHA, and a new push (new SHA) re-enables one rerun.
      HEAD_SHA=$(git rev-parse HEAD)
      RERUN_MARKER="$KEELSON_ARTIFACTS_DIR/.ci-rerun-attempted-$HEAD_SHA"
      if [ -f "$RERUN_MARKER" ]; then
        echo "CI already reran once for $HEAD_SHA this convergence; not rerunning again."
        log_advisory_checks
        echo "CI_STATUS: FAIL"
        exit 0
      fi
      touch "$RERUN_MARKER"
      echo "Rerunning failed jobs once to rule out flakes ..."
      HEAD_REF=$(cat "$KEELSON_ARTIFACTS_DIR/.pr-head-ref" 2>/dev/null || true)
      if [ -n "$HEAD_REF" ]; then
        forge run list --branch "$HEAD_REF" --limit 20 \
          --json databaseId,headSha,conclusion \
          -q ".[] | select(.headSha==\"$HEAD_SHA\" and .conclusion==\"failure\") | .databaseId" \
          | while read -r RID; do [ -n "$RID" ] && forge run rerun "$RID" --failed || true; done
      fi
      sleep 20
      if forge pr checks "$PR_NUM" --required --watch --interval 20 > "$KEELSON_ARTIFACTS_DIR/.ci-2.txt" 2>&1; then
        cat "$KEELSON_ARTIFACTS_DIR/.ci-2.txt"
        log_advisory_checks
        echo "CI_STATUS: PASS"
        exit 0
      fi
      echo "=== CI still failing after one rerun ==="
      cat "$KEELSON_ARTIFACTS_DIR/.ci-2.txt"
      log_advisory_checks
      echo "CI_STATUS: FAIL"
      exit 0

  # Re-fetch after the CI watch. fetch-state's threads.json is computed at the
  # START of the round, before the (possibly many-minute) CI watch; a
  # review-on-push bot can add a thread during the watch. Re-diffing the forge's
  # live unresolved set against the (resolve-retry-updated) ledger here gives
  # converge-check a fresh count so it never declares convergence over a thread
  # that landed mid-watch. Mirrors fetch-state's fork short-circuit.
  - id: post-ci-state
    depends_on: [await-ci]
    bash: |
      set -euo pipefail
      PR_NUM=$(cat "$KEELSON_ARTIFACTS_DIR/.pr-number" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$PR_NUM" ]; then
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-threads.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-retry.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-open-threads.json"
        echo "post-ci-state: no PR number recorded; nothing to re-check." >&2
        jq -cn '{is_fork: "unknown", new_count: 0, retry_count: 0, open_count: 0}'
        exit 0
      fi

      IS_FORK=$(forge pr view "$PR_NUM" --json isCrossRepository -q '.isCrossRepository' 2>/dev/null || echo "")
      if [ "$IS_FORK" = "true" ]; then
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-threads.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-retry.json"
        printf '[]\n' > "$KEELSON_ARTIFACTS_DIR/post-ci-open-threads.json"
        jq -cn '{is_fork: "true", new_count: 0, retry_count: 0, open_count: 0}'
        exit 0
      fi

      if [ ! -f "$KEELSON_ARTIFACTS_DIR/thread-lib.sh" ]; then
        echo "post-ci-state: thread-lib.sh missing (fetch-state did not run this round)." >&2
        exit 1
      fi

      . "$KEELSON_ARTIFACTS_DIR/thread-lib.sh"
      fetch_thread_state "$PR_NUM" "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json"

      jq '.new' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/post-ci-threads.json"
      jq '.retry' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/post-ci-retry.json"
      jq '.open' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json" \
        > "$KEELSON_ARTIFACTS_DIR/post-ci-open-threads.json"

      NEW_COUNT=$(jq '.new | length' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json")
      RETRY_COUNT=$(jq '.retry | length' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json")
      OPEN_COUNT=$(jq '.open | length' "$KEELSON_ARTIFACTS_DIR/post-ci-thread-state.json")
      echo "post-ci-state: $NEW_COUNT new, $RETRY_COUNT resolve-retry, $OPEN_COUNT open after CI." >&2
      jq -cn --argjson new_count "$NEW_COUNT" --argjson retry_count "$RETRY_COUNT" \
        --argjson open_count "$OPEN_COUNT" \
        '{is_fork: "false", new_count: $new_count, retry_count: $retry_count, open_count: $open_count}'

  - id: converge-check
    depends_on: [post-ci-state]
    bash: |
      set -euo pipefail
      ROUND="$converge.round"
      VERDICT="$KEELSON_ARTIFACTS_DIR/mergeability.json"
      jq -cn --argjson round "$ROUND" '{
        status: "unknown",
        review_threads_clear: null,
        open_threads: [],
        count: null,
        ci_status: "UNKNOWN",
        round: $round
      }' > "$VERDICT"
      # Gate on the post-CI re-fetch, NOT fetch-state's start-of-round threads.json:
      # NEW_COUNT counts threads that appeared (e.g. a bot on push) with no ledger
      # entry, RETRY_COUNT counts resolvable threads still awaiting a successful resolve.
      NEW_COUNT=$(jq 'length' "$KEELSON_ARTIFACTS_DIR/post-ci-threads.json" 2>/dev/null || echo 0)
      RETRY_COUNT=$(jq 'length' "$KEELSON_ARTIFACTS_DIR/post-ci-retry.json" 2>/dev/null || echo 0)
      OPEN_COUNT=$(jq 'length' "$KEELSON_ARTIFACTS_DIR/post-ci-open-threads.json" 2>/dev/null || echo 0)
      # bash nodes do not get $<node>.output text-substitution (rawBody runs, to
      # avoid injecting upstream output); read await-ci's output from the safe
      # env-var channel instead.
      CI_STATUS=$(printf '%s\n' "$KEELSON_NODE_await_ci_OUTPUT" | awk -F'CI_STATUS: ' '/CI_STATUS: / {print $2}' | tail -1 | awk '{print $1}')

      VERDICT_STATUS=pending
      if [ "$CI_STATUS" = "PASS" ] && [ "$NEW_COUNT" -eq 0 ] && [ "$RETRY_COUNT" -eq 0 ]; then
        VERDICT_STATUS=converged
      elif [ "$ROUND" -ge 8 ]; then
        VERDICT_STATUS=exhausted
      fi
      if ! jq --arg status "$VERDICT_STATUS" --arg ci_status "${CI_STATUS:-UNKNOWN}" \
        --argjson round "$ROUND" '{
          status: $status,
          review_threads_clear: (length == 0),
          open_threads: [ .[] | {threadId, path, line} ],
          count: length,
          ci_status: $ci_status,
          round: $round
        }' "$KEELSON_ARTIFACTS_DIR/post-ci-open-threads.json" > "$VERDICT.tmp"; then
        rm -f "$VERDICT.tmp"
        echo "Could not derive the review-thread verdict from post-ci-open-threads.json." >&2
        exit 1
      fi
      mv "$VERDICT.tmp" "$VERDICT"

      if [ "$VERDICT_STATUS" = "converged" ]; then
        if [ "$OPEN_COUNT" -eq 0 ]; then
          echo "REVIEW_THREADS_CLEAR: yes"
        else
          echo "REVIEW_THREADS_CLEAR: no"
        fi
        echo "Converged: CI passed, no new unresolved threads after CI, and no pending resolve-retries."
        rm -f "$KEELSON_ARTIFACTS_DIR/.last-gate-state"
        exit 0
      fi

      GATE_STATE="ci=$CI_STATUS new=$NEW_COUNT retry=$RETRY_COUNT"
      LAST_STATE=$(cat "$KEELSON_ARTIFACTS_DIR/.last-gate-state" 2>/dev/null || true)
      printf '%s\n' "$GATE_STATE" > "$KEELSON_ARTIFACTS_DIR/.last-gate-state"

      echo "Not converged: CI_STATUS=${CI_STATUS:-UNKNOWN}, new_threads=$NEW_COUNT, resolve_retries=$RETRY_COUNT, open_threads=$OPEN_COUNT"
      [ "$CI_STATUS" != "PASS" ] && echo "- CI is not green (status: ${CI_STATUS:-UNKNOWN})."
      [ "$NEW_COUNT" -gt 0 ] && echo "- $NEW_COUNT new thread(s) appeared during the CI watch and need a triage round."
      [ "$RETRY_COUNT" -gt 0 ] && echo "- $RETRY_COUNT resolvable thread(s) still await a successful resolve call."
      if [ -n "$LAST_STATE" ] && [ "$GATE_STATE" = "$LAST_STATE" ]; then
        echo "- Stalled: identical blockers to the previous round; more rounds will not change this without operator action."
      fi
      exit 1

  - id: report
    depends_on: [converge-check]
    context: fresh
    model: balanced
    prompt: |
      Produce the final resolve-pr summary.

      ## Inputs

      - PR number: `$ARTIFACTS_DIR/.pr-number`
      - Handled ledger: `$ARTIFACTS_DIR/handled.json` — append-only across
        rounds, so a re-triaged thread has multiple entries; count every metric
        from each thread's LATEST entry only (last occurrence per `threadId`).
        Each entry carries `replied` (bool) and `resolved` (bool). `resolved`
        is the authoritative signal: a thread with `resolve_authorized: true`
        whose `resolveReviewThread` call failed is recorded with
        `resolved: false`, so it is still open on the forge. Count resolutions
        from `resolved`, never from `action` or `decision`.
      - Latest unresolved threads: `$ARTIFACTS_DIR/post-ci-open-threads.json`
      - Post-CI new-thread set: `$ARTIFACTS_DIR/post-ci-threads.json`
      - Pending resolve-retries: `$ARTIFACTS_DIR/post-ci-retry.json`
      - Deterministic review-thread verdict: `$ARTIFACTS_DIR/mergeability.json`.
        Its `status` is `unknown`, `pending`, `exhausted`, or `converged`; use
        `review_threads_clear` only to describe the unresolved review-thread set,
        not whether the forge will permit a merge.
      - Reply/reconciliation failures: `$ARTIFACTS_DIR/reply-failures.json`
        (treat a missing file as an empty array)
      - Latest CI result:

        $await-ci.output

      - Converge gate:

        $converge-check.output

      ## Output format

      ```
      ## resolve-pr - PR #<N>

      ### Summary

      - Rounds completed: <count or latest round>
      - Threads replied to: <count of handled.json entries with replied == true>
      - Threads resolved: <count of handled.json entries with resolved == true>
      - Threads awaiting the reviewer: <count of handled.json entries with
        replied == true, resolved != true, and decision question / wontfix —
        left open deliberately>
      - Latest CI: PASS / FAIL / UNKNOWN
      - Review threads clear: yes
        OR
      - Review threads clear: no — <N> deliberately-open thread(s): <paths>

      ### Notes

      <Anything the operator needs to know. Call out any resolvable-but-
      unresolved threads (replied == true, resolved == false,
      resolve_authorized == true) — these still need a resolve. If
      question / wontfix threads remain open, say plainly that they are the
      remaining merge blockers when the repo requires all threads resolved, and
      that closing them is the reviewer's or operator's call. If
      reply-failures.json is non-empty, label the report "attention needed" and
      list the affected round, stage, thread ids, and reason. Note any exhaust
      approval if this report ran after a human override.>
      ```

      Print this report and also write it to `$ARTIFACTS_DIR/report.md`.
