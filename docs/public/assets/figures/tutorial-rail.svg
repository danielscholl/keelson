<svg viewBox="0 0 1056 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The seven-stop tutorial rail. Starting from nothing installed, five harness stops run left to right: 1 First run (one full chat turn), 2 Talk to it (three ways in, one store), 3 First workflow (a YAML DAG executes), 4 Remember (evidence it recalls later), and 5 Real build (one app on many models). The rail then drops to a second row of two rib stops, drawn in brass and running right to left: 6 Backlog (the app's work as a graph of beads) and 7 Factory (a swarm drains the graph into a working app).">
  <defs>
    <style>
      .lbl   { font-family: "Cascadia Code","SF Mono",ui-monospace,Menlo,monospace; }
      .navy  { fill:#1e3a5f; }
      .brass { fill:#8a5a1f; }
      .slate { fill:#64748b; }
    </style>
    <marker id="railarrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1e3a5f" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="60" y1="66" x2="60" y2="158" stroke="#64748b" stroke-width="1"
        stroke-dasharray="5 5" stroke-opacity="0.6"/>
  <text class="lbl slate" x="60" y="56" font-size="10" text-anchor="middle">start</text>
  <text class="lbl slate" x="60" y="176" font-size="10" text-anchor="middle">nothing</text>
  <text class="lbl slate" x="60" y="188" font-size="10" text-anchor="middle">installed</text>

  <line x1="64" y1="116" x2="84" y2="116" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="244" y1="116" x2="280" y2="116" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="440" y1="116" x2="476" y2="116" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="636" y1="116" x2="672" y2="116" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="832" y1="116" x2="868" y2="116" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="948" y1="150" x2="948" y2="222" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <line x1="868" y1="256" x2="832" y2="256" stroke="#1e3a5f" stroke-width="2" marker-end="url(#railarrow)"/>
  <g>
    <rect x="86" y="84" width="156" height="64" rx="4"
          fill="#2f6fb0" fill-opacity="0.06" stroke="#2f6fb0" stroke-width="1.8"/>
    <text class="lbl navy" x="164" y="112" font-size="12" text-anchor="middle">1 &#183; First run</text>
    <text class="lbl slate" x="164" y="131" font-size="10" text-anchor="middle">one full chat turn</text>
  </g>
  <g>
    <rect x="282" y="84" width="156" height="64" rx="4"
          fill="#2f6fb0" fill-opacity="0.06" stroke="#2f6fb0" stroke-width="1.8"/>
    <text class="lbl navy" x="360" y="112" font-size="12" text-anchor="middle">2 &#183; Talk to it</text>
    <text class="lbl slate" x="360" y="131" font-size="10" text-anchor="middle">three ways in, one store</text>
  </g>
  <g>
    <rect x="478" y="84" width="156" height="64" rx="4"
          fill="#2f6fb0" fill-opacity="0.06" stroke="#2f6fb0" stroke-width="1.8"/>
    <text class="lbl navy" x="556" y="112" font-size="12" text-anchor="middle">3 &#183; First workflow</text>
    <text class="lbl slate" x="556" y="131" font-size="10" text-anchor="middle">a YAML DAG executes</text>
  </g>
  <g>
    <rect x="674" y="84" width="156" height="64" rx="4"
          fill="#2f6fb0" fill-opacity="0.06" stroke="#2f6fb0" stroke-width="1.8"/>
    <text class="lbl navy" x="752" y="112" font-size="12" text-anchor="middle">4 &#183; Remember</text>
    <text class="lbl slate" x="752" y="131" font-size="10" text-anchor="middle">evidence it recalls</text>
  </g>
  <g>
    <rect x="870" y="84" width="156" height="64" rx="4"
          fill="#2f6fb0" fill-opacity="0.06" stroke="#2f6fb0" stroke-width="1.8"/>
    <text class="lbl navy" x="948" y="112" font-size="12" text-anchor="middle">5 &#183; Real build</text>
    <text class="lbl slate" x="948" y="131" font-size="10" text-anchor="middle">one app, many models</text>
  </g>
  <g>
    <rect x="870" y="224" width="156" height="64" rx="4"
          fill="#b5803a" fill-opacity="0.08" stroke="#b5803a" stroke-width="1.8"/>
    <text class="lbl navy" x="948" y="252" font-size="12" text-anchor="middle">6 &#183; Backlog</text>
    <text class="lbl brass" x="948" y="271" font-size="10" text-anchor="middle">a graph of beads</text>
  </g>
  <g>
    <rect x="674" y="224" width="156" height="64" rx="4"
          fill="#b5803a" fill-opacity="0.08" stroke="#b5803a" stroke-width="1.8"/>
    <text class="lbl navy" x="752" y="252" font-size="12" text-anchor="middle">7 &#183; Factory</text>
    <text class="lbl brass" x="752" y="271" font-size="10" text-anchor="middle">a swarm drains it</text>
  </g>
  <path d="M 86 48 L 86 40 L 1026 40 L 1026 48" fill="none" stroke="#2f6fb0" stroke-width="1.2"/>
  <text class="lbl slate" x="556" y="32" font-size="10" text-anchor="middle">the harness alone</text>
  <path d="M 674 298 L 674 306 L 1026 306 L 1026 298" fill="none" stroke="#b5803a" stroke-width="1.2"/>
  <text class="lbl brass" x="850" y="322" font-size="10" text-anchor="middle">with the beads and swarm ribs</text>
</svg>
